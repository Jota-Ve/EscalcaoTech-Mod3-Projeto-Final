server:
  port: 8080

spring:
  application:
    name: transfer-scheduling

  datasource:
    url: jdbc:h2:mem:transferschedulingdb;DB_CLOSE_DELAY=-1;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  api-docs:
    path: /v3/api-docs

jwt:
  secret: ${JWT_SECRET:c3VwZXItc2VjcmV0LXNpZ25pbmcta2V5LWZvci10cmFuc2Zlci1zY2hlZHVsaW5nLXByb2plY3QtYWRhLTIwMjYtYWJjZGVm}
  expiration-ms: 3600000

logging:
  level:
    com.ada.transferscheduling: DEBUG
    org.springframework.security: INFO
